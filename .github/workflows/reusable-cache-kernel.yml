name: cache-kernel
run-name: Cache ${{ format('{0}-{1}', inputs.kernel_flavor, inputs.version) }} Kernel
on:
  workflow_call:
    inputs:
      architecture:
        description: "JSON string of architectures to build, '[aarch64, x86_64]'"
        default: "['x86_64']"
        required: false
        type: string
      kernel_flavor:
        description: "The Kernel flavor: main, coreos-stable, longterm-6.12, etc"
        required: true
        type: string
      version:
        description: "Release Version: 10, 41, 42, etc"
        required: true
        type: string
    outputs:
      KCKEY:
        description: Cache Key
        value: ${{ jobs.check.outputs.KCKEY }}
  workflow_dispatch:
    inputs:
      architecture:
        description: "JSON string of architectures to build, '[aarch64, x86_64]'"
        default: "['x86_64']"
        required: false
        type: string
      kernel_flavor:
        description: "The Kernel flavor: main, coreos-stable, longterm-6.12, etc"
        required: true
        type: string
      version:
        description: "Release Version: 10, 41, 42, etc"
        required: true
        type: string
env:
  AKMODS_KERNEL: ${{ inputs.kernel_flavor }}
  AKMODS_VERSION: ${{ inputs.version }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.version }}-${{ inputs.kernel_flavor }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decision.outputs.publish }}
    steps:
      - id: decision
        run: echo "publish=${{ github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) }}" >> "$GITHUB_OUTPUT"

  cache-kernel:
    needs: policy
    environment:
      name: ${{ needs.policy.outputs.publish == 'true' && 'ksign' || '' }}
      deployment: false
    name: Cache ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'x86_64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    container:
      image: "ghcr.io/ublue-os/devcontainer:latest@sha256:5eac43970066ea1cb8b3af668338cc085479e860d0509a9d74cba8501133966a"
      options: "--privileged --volume /var/lib/containers:/var/lib/containers --security-opt seccomp=unconfined --security-opt label=disable --user 0:0"
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJson(inputs.architecture) }}
    env:
      AKMODS_KERNEL: ${{ inputs.kernel_flavor }}
      AKMODS_VERSION: ${{ inputs.version }}
      KSIGN_MODE: ${{ needs.policy.outputs.publish == 'true' && 'production' || 'test' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Mark Directory as Safe
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      
      - name: Get Kernel Version
        id: kernel-version
        run: just cache-kernel-version

      - name: Check Signing Helpers
        run: just test-signing-key

      - name: Determine signing cache key
        id: cache-key
        env:
          KERNEL_RELEASE: ${{ steps.kernel-version.outputs.kernel_release }}
          ARCH: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          source build_files/prep/check-signing-key.sh
          digest=$(signing_key_digest certs "$KSIGN_MODE")
          [[ "$KERNEL_RELEASE" == *."$ARCH" ]] || { echo "Kernel release '$KERNEL_RELEASE' does not match $ARCH" >&2; exit 1; }
          # Architecture is prepended by each cache consumer.
          release=${KERNEL_RELEASE%.*}
          echo "key=fc${{ inputs.version }}-${{ inputs.kernel_flavor }}-$release-$KSIGN_MODE-$digest" >> "$GITHUB_OUTPUT"

      - name: Cache Kernel RPMs
        id: cache-kernel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.kernel-version.outputs.KCPATH }}
          key: ${{ matrix.architecture }}-${{ steps.cache-key.outputs.key }}

      - name: Retrieve Signing Keys
        if: needs.policy.outputs.publish == 'true' && steps.cache-kernel.outputs.cache-hit != 'true'
        env:
          KSIGN_20240711: ${{ secrets.KSIGN_20240711 }}
        shell: bash
        run: just write-signing-keys

      - name: Fetch Kernel
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: just fetch-kernel

      - name: List Cached Kernel RPMs
        run: find ${{ steps.kernel-version.outputs.KCPATH }}

      - name: Validate Kernel Cache
        env:
          CACHE_DIR: ${{ steps.kernel-version.outputs.KCPATH }}
          KERNEL_NAME: ${{ steps.kernel-version.outputs.kernel_name }}
          KERNEL_RELEASE: ${{ steps.kernel-version.outputs.kernel_release }}
        run: bash build_files/test/check-kernel-cache.sh "$CACHE_DIR" "$KERNEL_NAME" "$KERNEL_RELEASE"

      - name: Record architecture cache key
        env:
          CACHE_KEY: ${{ steps.cache-key.outputs.key }}
          ARCH: ${{ matrix.architecture }}
        shell: bash
        run: echo "$CACHE_KEY" > "cache-key-$ARCH.txt"

      - name: Upload architecture cache key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-cache-key-${{ inputs.kernel_flavor }}-${{ inputs.version }}-${{ matrix.architecture }}
          path: cache-key-${{ matrix.architecture }}.txt
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Remove Signing Keys
        if: always()
        run: just remove-signing-keys
  check:
    name: Check all ${{ format('{0}-{1}', inputs.kernel_flavor, inputs.version) }} cache successful
    runs-on: ubuntu-26.04
    needs: [cache-kernel]
    outputs:
      KCKEY: ${{ steps.agreement.outputs.key }}
    permissions:
      actions: read
    steps:
      - name: Download architecture cache keys
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kernel-cache-key-${{ inputs.kernel_flavor }}-${{ inputs.version }}-*
          path: cache-keys
          merge-multiple: true
      - name: Verify architecture agreement
        id: agreement
        env:
          ARCHITECTURES: ${{ inputs.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          # Every architecture must have cached the same kernel, because the
          # build jobs receive a single cache key.
          shared_key=""
          for arch in $(jq -r '.[]' <<< "$ARCHITECTURES"); do
            key_file="cache-keys/cache-key-$arch.txt"
            if [[ ! -s "$key_file" ]]; then
              echo "::error::No cache key was recorded for $arch"
              exit 1
            fi
            key=$(cat "$key_file")
            echo "$arch: $key"
            if [[ -z "$shared_key" ]]; then
              shared_key="$key"
            elif [[ "$key" != "$shared_key" ]]; then
              echo "::error::Architectures cached different kernels; see the keys above"
              exit 1
            fi
          done
          echo "key=$shared_key" >> "$GITHUB_OUTPUT"
